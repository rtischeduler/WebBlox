name: ref-crawl
on:
  workflow_dispatch:
    inputs:
      start_url:
        description: Page to start crawling from
        required: true
        default: https://play.roblox.com/games/start
      out_dir:
        description: Folder in the repo for the results
        required: true
        default: Ref

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - name: download repo
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: crawl
        run: |
          rm -rf "${{ inputs.out_dir }}"
          node .github/scripts/ref-crawl.mjs "${{ inputs.start_url }}" "${{ inputs.out_dir }}"

      - name: summary
        run: |
          {
            echo "## engine"
            echo '```'
            cat "${{ inputs.out_dir }}/engine-base.txt"
            cat "${{ inputs.out_dir }}/binaries.tsv"
            echo '```'
            echo "## shared memory report"
            echo '```'
            head -c 60000 "${{ inputs.out_dir }}/sab-report.txt"
            echo '```'
            echo "## crawl index"
            echo '```'
            cut -f1-5 "${{ inputs.out_dir }}/index.tsv" | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          du -sh "${{ inputs.out_dir }}"

      - name: commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git config http.postBuffer 524288000
          git config http.lowSpeedLimit 0
          git config http.lowSpeedTime 999999
          node .github/scripts/push-chunks.mjs "${{ inputs.out_dir }}" "${{ github.ref_name }}" 40 "crawl ${{ inputs.start_url }} into ${{ inputs.out_dir }}"
