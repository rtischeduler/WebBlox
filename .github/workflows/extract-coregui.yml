name: extract-coregui
on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: zstd support
        run: pip install -q zstandard
      - name: find + unpack the CoreGui patch
        run: python3 -u .github/scripts/extract-coregui.py analysis/coregui
      - name: summary
        run: |
          { printf '%s\n' '```'; cat analysis/coregui/report.txt; printf '%s\n' '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: commit to main
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add analysis/coregui
          git commit -qm "CoreGui patch extraction" || { echo nothing; exit 0; }
          git pull -q --rebase origin main
          git push origin HEAD:main
