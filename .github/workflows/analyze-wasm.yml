name: analyze-wasm
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: get wasm-tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo bytecodealliance/wasm-tools --pattern 'wasm-tools-*-x86_64-linux.tar.gz' --output wt.tgz
          mkdir wt && tar xzf wt.tgz -C wt --strip-components=1
          wt/wasm-tools --version
      - name: unpack wasm
        run: cat engine/WebClient.wasm.gz.part* | gunzip > /tmp/WebClient.wasm
      - name: search wasm
        run: python3 -u .github/scripts/wasm-search.py /tmp/WebClient.wasm analysis wt/wasm-tools
      - name: summary
        run: |
          { echo "## network callgraph"; echo '```'; head -c 40000 analysis/network-callgraph.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ls -la analysis
      - name: commit analysis to main
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add analysis
          git commit -qm "Wasm analysis" || { echo nothing; exit 0; }
          git pull -q --rebase origin main
          git push origin HEAD:main
