name: run-corescripts
on:
  workflow_dispatch:
    inputs:
      steps:
        description: scheduler steps to run
        default: "200"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: zstd support
        run: pip install -q zstandard
      - uses: actions/cache@v4
        id: patchcache
        with:
          path: patchcache
          key: coregui-patch-v2
      - name: use cached patch
        if: steps.patchcache.outputs.cache-hit == 'true'
        run: mkdir -p /tmp/cg-out && cp patchcache/*.tar.gz /tmp/cg-out/
      - name: extract the patch (into /tmp only, nothing big is committed)
        env:
          ROBLOSECURITY: ${{ secrets.ROBLOSECURITY }}
        if: steps.patchcache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3 4 5 6; do
            python3 -u .github/scripts/extract-coregui.py /tmp/cg-out || true
            ls /tmp/cg-out/src-online-*.tar.gz >/dev/null 2>&1 && break
            echo "no archive on try $i, retrying"; sleep 20
          done
          mkdir -p patchcache; cp /tmp/cg-out/src-online-InExperience.tar.gz patchcache/ || true
      - name: run the real StarterScript headless (no npm needed)
        continue-on-error: true
        run: |
          set +e +o pipefail
          mkdir -p /tmp/patch analysis/coregui
          {
            echo "archives:"; find /tmp/cg-out -name '*.tar.gz' -print; echo "extractor report tail:"; tail -n 25 /tmp/cg-out/report.txt 2>&1 | cut -c1-220
            f=$(find /tmp/cg-out -name 'src-online-*.tar.gz' -print -quit); echo "using: $f"
            tar xzf "$f" -C /tmp/patch; echo "tar exit $?"
            node tools/run-corescripts.mjs /tmp/patch ${{ inputs.steps }}; echo "node exit $?"
            s=$(find /tmp/patch -path '*CoreScripts/StarterScript*' -type f -print -quit)
            for m in Workspace/Packages/Achievements Workspace/Packages/_Workspace/Achievements/Achievements Workspace/Packages/_Workspace/Achievements/Achievements/InExpAchievementManager; do
              echo; echo "== SINGLE $m =="; SINGLE=PatchRoot/DataModelInstances/CorePackages/$m node tools/measure-runtime.mjs /tmp/patch 1 2>&1 | cut -c1-900 | head -14
            done
            for n in AvatarExperienceCommon/Constants Settings/BackButtonController; do
              f=$(find /tmp/patch -path "*$n.luau*" -type f -print -quit); echo; echo "== consts $n ($f) =="; head -c 24 "$f" | xxd | head -2; strings -n 2 "$f" | tr '\n' ' ' | fold -w 200 | tail -n 9
            done
            echo; echo "== StarterScript file: $s =="; strings -n 3 "$s" | tr '\n' ' ' | fold -w 200
          } > analysis/coregui/corescripts-report.txt 2>&1
          head -c 2500 analysis/coregui/corescripts-report.txt
      - name: commit to main
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add analysis/coregui/corescripts-report.txt
          git commit -qm "CoreScripts headless run report" || { echo nothing; exit 0; }
          git pull -q --rebase origin main
          git push origin HEAD:main
