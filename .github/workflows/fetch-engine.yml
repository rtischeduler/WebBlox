name: fetch-engine
on:
  workflow_dispatch:
    inputs:
      engine_base:
        description: Engine base URL (leave empty to resolve the current production version)
        required: false
        default: ""

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download repo
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: fetch engine
        run: node .github/scripts/fetch-engine.mjs engine "${{ inputs.engine_base }}"

      - name: join strings from wasm
        run: |
          cat engine/WebClient.wasm.gz.part* | gunzip | strings -n 6 | grep -iE 'gamejoin|join-?game|joinscript|placelauncher|request(private)?game|authenticationticket|ticket|machineaddress|udmux|serverconnect|sessionid|wss?://|\.roblox\.com|\.rbxcdn\.com|websocket|handshake|replicat' | sort -u | head -c 400000 > engine/join-strings.txt || true
          wc -c engine/join-strings.txt

      - name: summary
        run: |
          {
            echo "## engine"
            echo '```'
            cat engine/engine-base.txt
            cat engine/manifest.json
            cat engine/wasm-info.txt
            echo '```'
            echo "## join strings (wasm)"
            echo '```'
            head -c 30000 engine/join-strings.txt
            echo '```'
            echo "## js hints"
            echo '```'
            head -c 50000 engine/js-hints.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: engine
          path: engine
          retention-days: 14

      - name: commit engine to main
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add engine
          git commit -qm "Engine snapshot $(cat engine/engine-base.txt)" || { echo nothing to commit; exit 0; }
          git pull -q --rebase origin main
          git push origin HEAD:main
