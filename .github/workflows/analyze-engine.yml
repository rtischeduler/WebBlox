name: analyze-engine
on:
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: unpack wasm
        run: |
          mkdir -p /tmp/e && cat engine/WebClient.wasm.gz.part* | gunzip > /tmp/e/WebClient.wasm
          cp engine/WebClient.js /tmp/e/
      - name: analyze
        run: python3 .github/scripts/analyze-engine.py analysis /tmp/e/WebClient.wasm
      - name: summary
        run: |
          { echo "## analysis files"; ls -l analysis; echo "## endpoints (head)"; head -c 6000 analysis/endpoints.txt; } >> "$GITHUB_STEP_SUMMARY"
      - name: commit to main
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add analysis
          git commit -qm "Engine analysis" || { echo nothing to commit; exit 0; }
          git pull -q --rebase origin main
          git push origin HEAD:main
