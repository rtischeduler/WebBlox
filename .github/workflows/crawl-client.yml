name: crawl-client
on:
  workflow_dispatch:
    inputs:
      start_url:
        description: Page to start crawling from
        required: true
        default: https://play.roblox.com/games/start
      out_dir:
        description: Folder in the repo for the results
        required: true
        default: Client

jobs:
  crawl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download repo
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: crawl
        run: |
          rm -rf "${{ inputs.out_dir }}"
          node .github/scripts/crawl.mjs "${{ inputs.start_url }}" "${{ inputs.out_dir }}"

      - name: summary
        run: |
          {
            echo "## crawl index"
            echo '```'
            cat "${{ inputs.out_dir }}/engine-base.txt"
            cut -f1-5 "${{ inputs.out_dir }}/index.tsv" | head -c 60000
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: commit results
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A "${{ inputs.out_dir }}"
          git commit -m "crawl ${{ inputs.start_url }} into ${{ inputs.out_dir }}" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
