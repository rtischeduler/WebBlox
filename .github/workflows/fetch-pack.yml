name: fetch-pack
on:
  workflow_dispatch:
    inputs:
      url:
        description: Core pack to download
        required: true
        default: https://truffled.lol/games/webblox/core.pack.gz
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          mkdir -p Assets
          curl -fL --retry 3 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36" -o Assets/core.pack.gz "${{ inputs.url }}"
          ls -l Assets/core.pack.gz
          gzip -t Assets/core.pack.gz
          echo "uncompressed: $(gzip -dc Assets/core.pack.gz | wc -c) (boot.js expects 15903704)"
      - name: commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add Assets/core.pack.gz
          git commit -m "Add core.pack.gz" || exit 0
          git push origin HEAD:${{ github.ref_name }}
