name: Apply Patch File

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering

# Crucial fix: Grant write permissions to the repository contents
permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Apply patch
      run: |
        if [ -f "patch.patch" ]; then
          git apply patch.patch
        else
          echo "patch.patch file not found!"
          exit 1
        fi

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        git add .
        
        # Only commit and push if changes actually exist to prevent workflow errors
        if ! git diff --cached --quiet; then
          git commit -m "chore: automatically applied patch"
          git push
        else
          echo "No changes to commit (patch might already be applied)."
        fi
