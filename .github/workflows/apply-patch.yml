name: Apply Git Patch

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows you to trigger this manually from the Actions tab

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Check if the patch can be applied cleanly (Optional but recommended)
      - name: Check patch compatibility
        run: |
          git apply --check path/to/your/file.patch

      # 3. Apply the patch 
      - name: Apply patch file
        run: |
          git apply path/to/your/file.patch

      # 4. Commit and push the changes back to GitHub
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: automatically applied patch"
          git push
