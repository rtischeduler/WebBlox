<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebBlox</title>
<script>
(() => {
  if (window.__wbConsole) return;
  const MAX = 3000, DOM_MAX = 1500, CAP = 4000;
  const buf = [];
  let ui = null, unseen = 0;
  const pad = (n, l = 2) => String(n).padStart(l, "0");
  const stamp = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds()) + "." + pad(d.getMilliseconds(), 3); };
  const fmt = (v) => {
    try {
      if (typeof v === "string") return v;
      if (v instanceof Error) return v.stack || v.message;
      if (typeof v === "function") return String(v);
      if (v && typeof v === "object") { try { return JSON.stringify(v, (k, x) => (typeof x === "bigint" ? String(x) : x), 2); } catch { return Object.prototype.toString.call(v); } }
      return String(v);
    } catch { return "[unprintable]"; }
  };
  const line = (e) => "[" + e.t + "] [" + e.src + "] [" + e.level + "] " + e.text + (e.n > 1 ? "  (x" + e.n + ")" : "");

  function add(src, level, text) {
    text = String(text).slice(0, CAP);
    const last = buf[buf.length - 1];
    if (last && last.src === src && last.level === level && last.text === text) {
      last.n++;
      if (ui) ui.update(last);
    } else {
      const e = { t: stamp(), src, level, text, n: 1, el: null };
      buf.push(e);
      if (buf.length > MAX) buf.shift();
      if (ui) ui.append(e);
    }
    if (level === "error") { unseen++; if (ui) ui.badge(); }
  }

  for (const m of ["log", "info", "warn", "error", "debug"]) {
    const orig = console[m];
    console[m] = function (...a) { try { add("H", m, a.map(fmt).join(" ")); } catch {} return orig.apply(this, a); };
  }
  addEventListener("error", (e) => {
    if (e.target && e.target !== window) { const u = e.target.src || e.target.href; if (u) add("H", "error", "Failed to load " + u); return; }
    add("H", "error", (e.message || "Error") + (e.filename ? " (" + e.filename + ":" + e.lineno + ":" + e.colno + ")" : ""));
  }, true);
  addEventListener("unhandledrejection", (e) => add("H", "error", "Unhandled rejection: " + fmt(e.reason)));

  function build() {
    const host = document.createElement("div");
    host.id = "wb-console-host";
    const root = host.attachShadow({ mode: "open" });
    root.innerHTML =
      "<style>" +
      "*{box-sizing:border-box}" +
      "#btn{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;border:1px solid #666;background:#1b1b1bd9;color:#eee;font:600 13px ui-monospace,monospace;z-index:2147483647;padding:0}" +
      "#badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e03131;color:#fff;font:700 11px/18px system-ui;display:none;padding:0 4px}" +
      "#panel{position:fixed;left:0;right:0;bottom:0;height:55vh;height:55dvh;display:none;flex-direction:column;background:#0a0a0af2;color:#ddd;z-index:2147483647;border-top:1px solid #444;padding-bottom:env(safe-area-inset-bottom)}" +
      "#panel.open{display:flex}" +
      "#bar{display:flex;gap:6px;padding:6px;border-bottom:1px solid #333;align-items:center}" +
      "#bar span{flex:1;font:12px system-ui;color:#999}" +
      "button{font:13px system-ui;padding:8px 10px;background:#2a2a2a;color:#eee;border:1px solid #555;border-radius:6px}" +
      "button.on{background:#3b5bdb;border-color:#3b5bdb}" +
      "#log{flex:1;overflow:auto;padding:6px;font:11px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;-webkit-user-select:text;user-select:text;-webkit-touch-callout:default;overscroll-behavior:contain}" +
      ".e{padding:2px 0;border-bottom:1px solid #1c1c1c;-webkit-user-select:text;user-select:text}" +
      ".l-error{color:#ff6b6b}.l-warn{color:#ffd166}.l-info{color:#7cc7ff}.l-debug{color:#9a9a9a}.l-result{color:#8ce99a}.l-cmd{color:#b197fc}" +
      "#log.only .l-log,#log.only .l-info,#log.only .l-debug,#log.only .l-result,#log.only .l-cmd{display:none}" +
      "#row{display:flex;border-top:1px solid #333}" +
      "#in{flex:1;min-width:0;font:16px ui-monospace,monospace;background:#111;color:#eee;border:0;padding:8px;outline:0}" +
      "</style>" +
      '<button id="btn" aria-label="Open console">&gt;_<span id="badge"></span></button>' +
      '<div id="panel"><div id="bar"><span id="hint">H=host F=page</span>' +
      '<button id="only">Errors</button><button id="copy">Copy</button><button id="clear">Clear</button><button id="close">&#x2715;</button></div>' +
      '<div id="log"></div><div id="row"><input id="in" placeholder="js (prefix ! to run in the page)" autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false"></div></div>';
    const $ = (id) => root.getElementById(id);
    const log = $("log"), panel = $("panel"), btn = $("btn"), badgeEl = $("badge");
    let open = false, only = false;

    const render = (e) => {
      const d = document.createElement("div");
      d.className = "e l-" + e.level;
      d.textContent = line(e);
      e.el = d;
      return d;
    };
    const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    const api = {
      host,
      append(e) {
        if (!open) return;
        const stick = atBottom();
        log.appendChild(render(e));
        while (log.childElementCount > DOM_MAX) log.removeChild(log.firstChild);
        if (stick) log.scrollTop = log.scrollHeight;
      },
      update(e) { if (open && e.el) e.el.textContent = line(e); },
      badge() { if (open || !unseen) { badgeEl.style.display = "none"; return; } badgeEl.textContent = unseen > 99 ? "99+" : unseen; badgeEl.style.display = "block"; },
      open() {
        open = true; unseen = 0; api.badge();
        log.textContent = "";
        const frag = document.createDocumentFragment();
        for (const e of buf.slice(-DOM_MAX)) frag.appendChild(render(e));
        log.appendChild(frag);
        panel.classList.add("open"); btn.style.display = "none";
        log.scrollTop = log.scrollHeight;
      },
      close() { open = false; panel.classList.remove("open"); btn.style.display = ""; },
      text() { return buf.filter((e) => !only || e.level === "error" || e.level === "warn").map(line).join("\n"); },
    };

    btn.onclick = api.open;
    $("close").onclick = api.close;
    $("clear").onclick = () => { buf.length = 0; log.textContent = ""; unseen = 0; api.badge(); };
    $("only").onclick = () => { only = !only; $("only").classList.toggle("on", only); log.classList.toggle("only", only); };
    $("copy").onclick = async () => {
      const text = api.text(), b = $("copy");
      let ok = false;
      try { await navigator.clipboard.writeText(text); ok = true; } catch {}
      if (!ok) {
        try {
          const ta = document.createElement("textarea");
          ta.value = text; ta.style.cssText = "position:fixed;opacity:0;left:0;top:0";
          root.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
          ok = document.execCommand("copy"); ta.remove();
        } catch {}
      }
      b.textContent = ok ? "Copied" : "Failed";
      setTimeout(() => { b.textContent = "Copy"; }, 1200);
    };
    $("in").addEventListener("keydown", async (ev) => {
      if (ev.key !== "Enter") return;
      const input = ev.target, code = input.value.trim();
      if (!code) return;
      input.value = "";
      add("H", "cmd", "> " + code);
      try {
        let r;
        if (code[0] === "!") {
          const f = window.webblox && window.webblox.frame;
          if (!f) throw new Error("page frame not ready yet");
          r = await f.eval_js(code.slice(1));
        } else r = (0, eval)(code);
        if (r && typeof r.then === "function") r = await r;
        add("H", "result", fmt(r));
      } catch (e) { add("H", "error", fmt(e)); }
    });
    return api;
  }

  const mount = () => {
    if (!ui) ui = build();
    if (!ui.host.isConnected) document.documentElement.appendChild(ui.host);
    ui.badge();
  };
  const start = () => {
    mount();
    new MutationObserver(() => { if (ui && !ui.host.isConnected) document.documentElement.appendChild(ui.host); }).observe(document.documentElement, { childList: true });
  };
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();

  window.__wbConsole = {
    add,
    frame(batch) { for (const [level, text] of batch || []) add("F", level, text); },
    open: () => { mount(); ui.open(); },
    close: () => ui && ui.close(),
    text: () => (ui ? ui.text() : buf.map(line).join("\n")),
  };
})();
</script>

<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: system-ui, sans-serif; overflow: hidden; }
  #wb-boot { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; }
  #wb-status { opacity: .8; font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<div id="wb-boot"><div><h2 style="margin:0">WebBlox</h2><div id="wb-status">Starting…</div></div></div>
<script>
(() => {
  const status = document.getElementById("wb-status");
  const say = (t) => { if (status) status.textContent = t; };
  const DEFAULT_PLACE = "10879318443";
  const START = "https://play.roblox.com/games/start";
  const DIST = "dist/sandstone.mjs";
  const SANDSTONE_RAW = "https://raw.githubusercontent.com/lotsacookie/Singuloxy/main/" + DIST;
  const FLAGS = { FFlagBaseClientGateOnSendChannel: "False", FLogGameJoinUtil: "7" };
  const BUILTIN = [
    "cdn.northstreetumc.org", "cdn.vipersfutbol.com", "cdn.pcesc.org", "cdn.kcchallengevbc.com",
    "cdn.slcbmooc.org", "cdn.topstargym.net", "cdn.goaplytexas.org", "cdn.clearfieldswimming.com",
    "wss://athollcottage.com/connection/", "wss://api.personalloanonline.net/ws/",
    "wss://kristenblackburnvolleyballcamps.com/socket/", "wss://southpadreislandkiteboarding.com/socket/",
  ];
  const FALLBACK = "wss://api.personalloanonline.net/ws/";
  const HOST_RE = /^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$/i;
  const WSS_RE = /^wss:\/\/[a-z0-9.-]+(:\d{1,5})?(\/[\w\-./]*)?$/i;
  const BAD_TTL = 6 * 3600000;

  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const isBackup = (e) => e.includes("://");
  const toWss = (e) => {
    e = String(e || "").trim();
    if (!e) return null;
    const u = isBackup(e) ? e : "wss://" + e + "/";
    return u.endsWith("/") ? u : u + "/";
  };
  const badMap = () => {
    const raw = store.get("WB_BAD"), out = {}, now = Date.now();
    if (raw && typeof raw === "object" && !Array.isArray(raw)) for (const [k, ts] of Object.entries(raw)) if (typeof ts === "number" && now - ts < BAD_TTL) out[k] = ts;
    return out;
  };
  const isBad = (e) => Object.hasOwn(badMap(), toWss(e));
  const markBad = (e) => { const m = badMap(); m[toWss(e)] = Date.now(); store.set("WB_BAD", m); };
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

  async function fetchWith(url, type, ms) {
    const c = new AbortController(), k = setTimeout(() => c.abort(), ms);
    try {
      const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store", signal: c.signal });
      if (!r.ok) throw new Error("HTTP " + r.status);
      return await r[type]();
    } finally { clearTimeout(k); }
  }
  const latestSha = (repo) => fetchWith("https://api.github.com/repos/" + repo + "/commits/main", "json", 3500)
    .then((d) => (d && /^[0-9a-f]{40}$/i.test(d.sha) ? d.sha : "")).catch(() => "");
  const bases = async (repo, extra = []) => {
    const s = await latestSha(repo);
    return [
      s && "https://cdn.jsdelivr.net/gh/" + repo + "@" + s + "/",
      "https://cdn.jsdelivr.net/gh/" + repo + "@main/",
      "https://fastly.jsdelivr.net/gh/" + repo + "@main/",
      "https://gcore.jsdelivr.net/gh/" + repo + "@main/",
      ...extra,
    ].filter(Boolean);
  };

  function decodeLoaderList(src, hostRe, wssRe, max, depth = 0) {
    if (depth > 3 || typeof src !== "string") return [];
    let code = null;
    try {
      const stub = new Proxy({}, { get: () => (a) => { if (code === null && typeof a === "string") code = a; } });
      new Function("globalThis", src)(stub);
    } catch {}
    if (!code) return [];
    const arrays = code.match(/\[(?:\s*"[^"\\]{3,120}"\s*,?)+\s*\]/g) || [];
    for (const arr of arrays) {
      let vals;
      try { vals = JSON.parse(arr.replace(/,\s*\]$/, "]")); } catch { continue; }
      const out = [];
      for (const v of vals) {
        const value = String(v).trim();
        if ((hostRe.test(value) || wssRe.test(value)) && !out.includes(value)) out.push(value);
        if (out.length >= max) break;
      }
      if (out.length >= 3 && out.length >= vals.length * 0.6) return out;
    }
    return decodeLoaderList(code, hostRe, wssRe, max, depth + 1);
  }

  function parseServerList(src) {
    if (typeof src !== "string") return [];
    const text = src.replace(/\\u([0-9a-fA-F]{4})/g, (_, h) => String.fromCharCode(parseInt(h, 16)));
    const block = text.match(/serverList\s*=\s*\[([\s\S]*?)\]\s*[;,]/);
    if (!block) return null;
    const item = /(["'])((?:\\.|(?!\1)[^\\])*)\1(\s*\.split\(\s*(?:""|'')\s*\)\s*\.reverse\(\)\s*\.join\(\s*(?:""|'')\s*\))?/g;
    const out = [];
    let m;
    while ((m = item.exec(block[1]))) {
      const value = (m[3] ? [...m[2]].reverse().join("") : m[2]).trim();
      if ((HOST_RE.test(value) || WSS_RE.test(value)) && !out.includes(value)) out.push(value);
      if (out.length >= 32) break;
    }
    return out;
  }

  function decodeInSandbox(src, ms = 4000) {
    return new Promise((resolve) => {
      const f = document.createElement("iframe");
      f.sandbox = "allow-scripts";
      f.style.display = "none";
      const done = (v) => { clearTimeout(t); removeEventListener("message", on); removeEventListener("message", ready); f.remove(); resolve(v); };
      const t = setTimeout(() => done([]), ms);
      const on = (e) => { if (e.source === f.contentWindow && e.data && e.data.wbDecoded) done(e.data.list || []); };
      const ready = (e) => {
        if (e.source !== f.contentWindow || !e.data || !e.data.wbReady) return;
        removeEventListener("message", ready);
        f.contentWindow.postMessage({ src, h: HOST_RE.source, w: WSS_RE.source }, "*");
      };
      addEventListener("message", on);
      addEventListener("message", ready);
      f.srcdoc = "<script>const decode=" + decodeLoaderList.toString() + ";" +
        'addEventListener("message",e=>{let l=[];try{l=decode(e.data.src,new RegExp(e.data.h,"i"),new RegExp(e.data.w,"i"),32)}catch{}' +
        'parent.postMessage({wbDecoded:1,list:l},"*")});parent.postMessage({wbReady:1},"*")<\/script>';
      document.body.append(f);
    });
  }

  async function syncStorageList(mirrors) {
    const cached = store.get("WB_SYNC");
    const cachedList = cached && Array.isArray(cached.list) ? cached.list.filter((u) => HOST_RE.test(u) || WSS_RE.test(u)) : [];
    if (cachedList.length && Date.now() - (cached.ts || 0) < 3600000) return cachedList;
    const failed = store.get("WB_SYNCF");
    if (failed && Date.now() - (failed.ts || 0) < 600000) return cachedList;
    for (const m of mirrors) {
      try {
        const src = await fetchWith(m + "loader.js", "text", 3500);
        const plain = parseServerList(src);
        const list = plain && plain.length ? plain : await decodeInSandbox(src);
        if (!list.length) throw new Error("no servers in loader.js");
        store.set("WB_SYNC", { ts: Date.now(), list });
        return list;
      } catch (e) { console.warn("[wisp] storage sync failed:", m, e && e.message || e); }
    }
    store.set("WB_SYNCF", { ts: Date.now() });
    return cachedList;
  }

  function parseWispList(json) {
    const b64 = Array.isArray(json) ? json.find((v) => typeof v === "string" && v.trim()) : json;
    if (typeof b64 !== "string") return [];
    let data;
    try { data = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64.trim()), (c) => c.charCodeAt(0)))); } catch { return []; }
    const out = [];
    (function walk(v) {
      if (typeof v === "string" && /^wss:\/\//i.test(v.trim())) out.push(v.trim());
      else if (Array.isArray(v)) v.forEach(walk);
      else if (v && typeof v === "object") Object.values(v).forEach(walk);
    })(data);
    return [...new Set(out)];
  }
  async function fetchWispList(mirrors) {
    try { return parseWispList(await Promise.any(mirrors.map((m) => fetchWith(m + "Assets/json/wss.json", "json", 5000)))); }
    catch { return []; }
  }

  function probeWisp(entry, timeoutMs = 3000) {
    return new Promise((resolve) => {
      let ws;
      try { ws = new WebSocket(toWss(entry)); } catch { return resolve(null); }
      ws.binaryType = "arraybuffer";
      let connected = false, sentAt = 0;
      const streamId = (Math.floor(Math.random() * 0xFFFFFFFE) + 1) >>> 0;
      const finish = (ping) => { clearTimeout(timer); ws.onmessage = ws.onerror = ws.onclose = null; try { ws.close(); } catch {} resolve(ping); };
      const timer = setTimeout(() => finish(null), timeoutMs);
      ws.onmessage = (e) => {
        if (!(e.data instanceof ArrayBuffer) || e.data.byteLength < 5) return;
        const v = new DataView(e.data), type = v.getUint8(0), stream = v.getUint32(1, true);
        if (!connected) {
          if (type === 5 && stream === 0) ws.send(new Uint8Array([5, 0, 0, 0, 0, 2, 1]));
          else if (type === 3 && stream === 0) {
            connected = true;
            const host = new TextEncoder().encode("127.0.0.1");
            const buf = new ArrayBuffer(8 + host.length), dv = new DataView(buf);
            dv.setUint8(0, 1); dv.setUint32(1, streamId, true); dv.setUint8(5, 1); dv.setUint16(6, 69, true);
            new Uint8Array(buf).set(host, 8);
            sentAt = performance.now();
            ws.send(buf);
          }
          return;
        }
        if (stream === streamId) finish(Math.round(performance.now() - sentAt));
      };
      ws.onerror = ws.onclose = () => finish(null);
    });
  }

  async function firstAlive(entries, label, waveSize = 6) {
    const alive = [];
    for (let i = 0; i < entries.length && !alive.length; i += waveSize) {
      const wave = entries.slice(i, i + waveSize);
      say(label + " (" + Math.min(i + waveSize, entries.length) + "/" + entries.length + ")…");
      const pings = await Promise.all(wave.map((e) => probeWisp(e)));
      wave.forEach((e, j) => { if (pings[j] !== null) alive.push({ entry: e, ping: pings[j] }); });
    }
    return alive.sort((a, b) => a.ping - b.ping)[0] || null;
  }

  function provisionalWisp(network) {
    const last = store.get("WB_LAST");
    const url = toWss(last && last.entry && !isBad(last.entry) ? last.entry : FALLBACK);
    network.set_websocket(url);
    return url;
  }

  async function pickWisp(network, mirrors, exclude = []) {
    const excluded = new Set(exclude.map(toWss));
    const allowed = (e) => !excluded.has(toWss(e));
    const prefer = (list) => {
      const ok = list.filter(allowed);
      return [...ok.filter((e) => !isBad(e)), ...ok.filter(isBad)];
    };
    const apply = (entry) => {
      const url = toWss(entry);
      network.set_websocket(url);
      try { network.set_wisp_pool([url]); } catch {}
      store.set("WB_LAST", { entry, ts: Date.now() });
      return url;
    };
    const search = async () => {
      const last = store.get("WB_LAST");
      if (last && last.entry && allowed(last.entry) && !isBad(last.entry) && Date.now() - last.ts < 600000 && (await probeWisp(last.entry)) !== null) return apply(last.entry);
      say("Syncing wisp list…");
      const synced = await syncStorageList(mirrors.storage);
      const all = prefer([...new Set([...synced, ...BUILTIN])]);
      const hit = await firstAlive(all.filter((e) => !isBackup(e)), "Testing wisp servers");
      if (hit) return apply(hit.entry);
      say("Trying backup wisps…");
      const remote = await fetchWispList(mirrors.kstuff);
      const backups = prefer([...new Set([...all.filter(isBackup), FALLBACK, ...shuffle(remote.filter((u) => !all.includes(u))).slice(0, 16)])]);
      const bhit = await firstAlive(backups, "Testing backup wisps");
      return bhit ? apply(bhit.entry) : null;
    };
    try {
      const url = await Promise.race([search(), new Promise((r) => setTimeout(() => r(null), 15000))]);
      if (url) return url;
    } catch (e) { console.warn("[wisp] pick failed", e); }
    console.warn("[wisp] no wisp validated, using fallback");
    return apply([FALLBACK, ...BUILTIN.filter(isBackup)].find(allowed) || FALLBACK);
  }

  function createWatchdog({ current, switchWisp, relaunch, max = 2 }) {
    let used = 0, busy = false, lastSig = null, shared = false;
    const warn = (m) => console.warn("[webblox] " + m);
    return async (text) => {
      if (typeof text !== "string" || !/\[LoadingScreen\]\s*Engine failure/i.test(text)) return;
      if (busy || used >= max || shared) return;
      const msg = /"message"\s*:\s*"((?:[^"\\]|\\.)*)"/.exec(text);
      const code = /"errorCode"\s*:\s*(-?\d+)/.exec(text);
      const sig = (code ? code[1] : "") + "|" + (msg ? msg[1] : "");
      warn("engine failure detail: code=" + (code ? code[1] : "?") + " message=" + (msg ? msg[1] : ""));
      if (lastSig !== null && sig === lastSig) {
        shared = true;
        warn("same engine failure on " + (used + 1) + " servers, not server-specific; not retrying");
        return;
      }
      busy = true;
      used++;
      try {
        const failed = current();
        if (failed) markBad(failed);
        warn("engine failed on " + failed + ", trying another server (" + used + "/" + max + ")");
        const next = await switchWisp(failed ? [failed] : []);
        if (!next || next === failed) { warn("no other server available"); return; }
        await relaunch();
        lastSig = sig;
      } catch (e) {
        warn("recovery failed: " + ((e && e.message) || e));
      } finally { busy = false; }
    };
  }

  const pageLocation = () => {
    if (location.search || location.hash) return location;
    try { void window.top.location.href; return window.top.location; } catch { return location; }
  };
  const startUrl = () => {
    const loc = pageLocation();
    const h = loc.hash.slice(1);
    if (/^https?:\/\//i.test(h)) return h;
    const id = new URLSearchParams(loc.search).get("placeId") || "";
    return START + "?placeId=" + (/^\d{1,20}$/.test(id) ? id : DEFAULT_PLACE);
  };

  const flagScript = () => {
    const json = JSON.stringify(FLAGS).replace(/</g, "\\u003c");
    return "<script data-webblox>(function(){var o=" + json + ";var d=window.__wasmDevSettings=window.__wasmDevSettings||{};var prev=d.getFlagOverrides;d.getFlagOverrides=function(){var p={};try{if(prev)p=prev()||{};}catch(e){}return Object.assign({},p,o);};})()<\/script>";
  };
  const injectFlags = (html) => {
    if (typeof html !== "string") return html;
    const extra = flagScript();
    const m = /<head[^>]*>/i.exec(html);
    return m ? html.slice(0, m.index + m[0].length) + extra + html.slice(m.index + m[0].length) : extra + html;
  };

  async function loadSandstone(list) {
    for (const b of list) { try { return await import(b + DIST); } catch { console.warn("[webblox] import failed", b); } }
    const code = await (await fetch(SANDSTONE_RAW)).text();
    return import(URL.createObjectURL(new Blob([code], { type: "text/javascript" })));
  }

  async function boot() {
    if (!window.crossOriginIsolated && !new URLSearchParams(pageLocation().search).has("force")) {
      const msg = "This page is not cross-origin isolated, which Roblox's threaded WebAssembly needs. Serve index.html with Cross-Origin-Opener-Policy: same-origin and Cross-Origin-Embedder-Policy: credentialless (add ?force=1 to try anyway).";
      console.error("[webblox] " + msg);
      say(msg);
      return;
    }
    say("Checking for updates…");
    const [sandBases, kstuff, storage] = await Promise.all([
      bases("lotsacookie/Singuloxy"),
      bases("lotsacookie/kstuff", ["https://raw.githubusercontent.com/lotsacookie/kstuff/main/", "https://cdn.statically.io/gh/lotsacookie/kstuff/main/"]),
      bases("TongSherbet/storage", ["https://raw.githubusercontent.com/TongSherbet/storage/main/"]),
    ]);
    const mirrors = { kstuff, storage };
    say("Loading proxy…");
    const sandstone = await loadSandstone(sandBases);
    provisionalWisp(sandstone.network);
    const frame = new sandstone.controller.ProxyFrame();
    Object.assign(frame.iframe.style, { position: "fixed", inset: "0", width: "100%", height: "100%", border: "0", background: "#fff" });
    await frame.wait_for_libcurl();
    let activeWisp = await pickWisp(sandstone.network, mirrors);
    console.log("[webblox] wisp:", activeWisp);
    const watchdog = createWatchdog({
      current: () => activeWisp,
      switchWisp: async (exclude) => {
        activeWisp = await pickWisp(sandstone.network, mirrors, exclude);
        console.log("[webblox] wisp:", activeWisp);
        return activeWisp;
      },
      relaunch: () => frame.navigate_to(startUrl()),
    });
    const send = frame.send_page;
    frame.send_page = (page) => send.call(frame, { ...page, html: injectFlags(page.html) });
    frame.on_console = (batch) => {
      try { globalThis.__wbConsole && globalThis.__wbConsole.frame(batch); } catch {}
      try { for (const item of batch || []) watchdog(item && item[1]); } catch {}
    };
    frame.on_info = ({ title }) => { if (title) document.title = title; };
    frame.on_progress = (_, text) => say(text || "Loading…");
    document.body.replaceChildren(frame.iframe);
    Object.assign(globalThis, { sandstone, webblox: { frame } });
    await frame.navigate_to(startUrl());
  }

  boot().catch((e) => { say("Failed: " + (e && e.message || e)); console.error(e); });
})();
</script>
</body>
</html>
