<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebBlox</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: system-ui, sans-serif; overflow: hidden; }
  #wb-boot { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; }
  #wb-status { opacity: .8; font-size: 14px; margin-top: 8px; }
  iframe.wb-frame { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
</style>
</head>
<body>
<div id="wb-boot"><div><h2 style="margin:0">WebBlox</h2><div id="wb-status">Starting…</div></div></div>
<script type="module">
  import { boot } from "./src/main.mjs";
  boot(document.getElementById("wb-status")).catch((e) => {
    document.getElementById("wb-status").textContent = "Failed: " + (e && e.message || e);
    console.error(e);
  });
</script>
</body>
</html>
