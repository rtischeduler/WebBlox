<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebBlox</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: system-ui, sans-serif; overflow: hidden; }
  #wb-boot { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; }
  #wb-status { opacity: .8; font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<div id="wb-boot"><div><h2 style="margin:0">WebBlox</h2><div id="wb-status">Starting…</div></div></div>
<script>
(() => {
  const status = document.getElementById("wb-status");
  const say = (t) => { if (status) status.textContent = t; };
  const get = async (u, ms, type) => {
    const c = new AbortController(), k = setTimeout(() => c.abort(), ms);
    try { const r = await fetch(u, { cache: "no-store", signal: c.signal }); if (!r.ok) throw 0; return await r[type](); }
    finally { clearTimeout(k); }
  };
  // Latest commit sha from the GitHub API, so jsdelivr serves an exact, uncached-stale revision.
  const sha = (repo) => get("https://api.github.com/repos/" + repo + "/commits/main", 3500, "json")
    .then((d) => (d && /^[0-9a-f]{40}$/i.test(d.sha) ? d.sha : "")).catch(() => "");
  const bases = async (repo) => {
    const s = await sha(repo);
    return [
      s && "https://cdn.jsdelivr.net/gh/" + repo + "@" + s + "/",
      "https://cdn.jsdelivr.net/gh/" + repo + "@main/",
      "https://fastly.jsdelivr.net/gh/" + repo + "@main/",
      "https://gcore.jsdelivr.net/gh/" + repo + "@main/",
    ].filter(Boolean);
  };
  (async () => {
    say("Checking for updates…");
    const [own, sand, kst] = await Promise.all([bases("rtischeduler/WebBlox"), bases("lotsacookie/Singuloxy"), bases("lotsacookie/kstuff")]);
    let mod = null, last = null;
    for (const b of own) { try { mod = await import(b + "src/main.mjs"); break; } catch (e) { last = e; } }
    if (!mod) throw last || new Error("could not load WebBlox from jsdelivr");
    await mod.boot(status, { sandstoneBases: sand, kstuffBases: kst });
  })().catch((e) => { say("Failed: " + (e && e.message || e)); console.error(e); });
})();
</script>
</body>
</html>
