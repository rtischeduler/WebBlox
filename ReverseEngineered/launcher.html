<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebBlox Launcher</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#ddd;font-family:system-ui,sans-serif;overflow:hidden}
#wb-boot{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:16px;overflow:auto}
input,button{font:16px system-ui;padding:10px;margin:4px;border-radius:6px;border:1px solid #555;background:#222;color:#eee;width:min(420px,90vw);box-sizing:border-box}
#wb-log{width:min(720px,94vw);height:30vh;overflow:auto;text-align:left;font:11px/1.4 ui-monospace,monospace;white-space:pre-wrap;background:#0a0a0a;padding:6px;margin-top:8px}
#game{position:fixed;inset:0}#canvas{width:100%;height:100%;display:block;outline:0}
#loading-overlay{position:fixed;inset:0;display:grid;place-items:center;background:#111;color:#ddd;text-align:center}
#loading-overlay.loading-exiting,#loading-overlay[hidden]{display:none}
#loading-background-image,#loading-experience-icon{max-width:160px}
#input-container{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;overflow:hidden}
</style></head><body>
<div id="wb-boot"><div>
<h2 style="margin:0">WebBlox Launcher</h2>
<div id="wb-status" style="opacity:.8;margin:8px 0">Starting…</div>
<div id="wb-form"><input id="wb-place" inputmode="numeric" placeholder="Place id"><br>
<input id="wb-cookie" type="password" autocomplete="off" placeholder="Optional: .ROBLOSECURITY (uses the proxy sign-in if empty)"><br>
<button id="wb-go" disabled>Join</button></div>
<div id="wb-log"></div><button id="wb-copy" style="width:auto">Copy log</button>
</div></div>
<div id="game" hidden>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="loading-overlay"><div>
<img id="loading-background-image" alt=""><div id="loading-icon-shell"><img id="loading-experience-icon" alt=""></div>
<h3 id="loading-experience-title"></h3><div id="loading-experience-creator"></div><span id="loading-verified-badge" hidden></span>
<div id="status"></div><button id="loading-cancel">Cancel</button>
<div class="loading-error-panel" hidden><div id="loading-error-title"></div><div id="loading-error-message"></div><div id="loading-error-code"></div><button id="loading-error-leave">Leave</button></div>
</div></div>
<div id="input-container"><input id="input-input"><textarea id="input-textarea"></textarea></div>
</div>
<script type="module">
const HEX = /^[0-9a-f]{40}$/i;
const TTL = 60000;
const read = (repo) => { try { const o = JSON.parse(localStorage.getItem("wb.sha." + repo) || "null"); return o && HEX.test(o.sha) ? o : null; } catch { return null; } };
const write = (repo, o) => { try { localStorage.setItem("wb.sha." + repo, JSON.stringify(o)); } catch {} };
const ghHeaders = () => {
  const h = { Accept: "application/vnd.github+json" };
  try { const t = localStorage.getItem("wb.ghtoken"); if (t) h.Authorization = "Bearer " + t; } catch {}
  return h;
};
const latest = async (repo) => {
  const c = read(repo), now = Date.now();
  if (c && (now - c.at < TTL || now < (c.until || 0))) return c.sha;
  const ctrl = new AbortController(), k = setTimeout(() => ctrl.abort(), 4000);
  try {
    const r = await fetch("https://api.github.com/repos/" + repo + "/commits/main", { headers: ghHeaders(), signal: ctrl.signal, cache: "no-store" });
    if (r.ok) {
      const d = await r.json();
      if (d && HEX.test(d.sha)) { write(repo, { sha: d.sha, at: Date.now() }); return d.sha; }
    } else if (c && (r.status === 403 || r.status === 429)) {
      const reset = Number(r.headers.get("x-ratelimit-reset")) * 1000;
      write(repo, { sha: c.sha, at: c.at, until: reset > now ? reset : now + 600000 });
    }
  } catch {} finally { clearTimeout(k); }
  return c ? c.sha : "";
};
const bases = async (repo) => {
  const s = await latest(repo);
  return [s && "https://cdn.jsdelivr.net/gh/" + repo + "@" + s + "/", ...["cdn", "fastly", "gcore"].map((h) => "https://" + h + ".jsdelivr.net/gh/" + repo + "@main/")].filter(Boolean);
};
const say = (t) => { const s = document.getElementById("wb-status"); if (s) s.textContent = t; };
(async () => {
  say("Checking for updates…");
  const [own, sand, kst, stor] = await Promise.all([bases("rtischeduler/WebBlox"), bases("lotsacookie/Singuloxy"), bases("lotsacookie/kstuff"), bases("TongSherbet/storage")]);
  let mod = null, last = null;
  for (const b of own) { try { mod = await import(b + "ReverseEngineered/src/launcher.mjs"); break; } catch (e) { last = e; } }
  if (!mod) { try { mod = await import("./src/launcher.mjs"); } catch (e) { throw last || e; } }
  await mod.boot({ sandstoneBases: sand, kstuffBases: kst, storageBases: stor });
})().catch((e) => { say("Failed: " + (e && e.message || e)); console.error(e); });
</script>
</body></html>
