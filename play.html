<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebBlox Play</title>
<style>
:root{color-scheme:dark;--ui:rgba(25,27,29,.75);--ui-solid:#232527;--line:rgba(255,255,255,.12);--text:#fff;--dim:#bdbebe;--blue:#335fff;--bad:#ef6a6a;
--font:"Builder Sans","Gotham SSm","Gotham",Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#000;color:var(--text);font:14px/1.4 var(--font);overflow:hidden;-webkit-user-select:none;user-select:none}
#game{position:fixed;inset:0;width:100%;height:100%;background:#000;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* top bar */
#topbar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));right:calc(10px + env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center;pointer-events:none;z-index:5}
#topbar>*{pointer-events:auto}
.tb{width:44px;height:44px;border-radius:22px;background:var(--ui);display:grid;place-items:center}
.tb:hover{background:rgba(60,63,66,.8)}
.tb[aria-pressed=true]{background:rgba(255,255,255,.9);color:#000}
.tb svg{width:22px;height:22px;fill:currentColor}
#spacer{flex:1}

/* chat */
#chat{position:fixed;left:calc(10px + env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));width:min(340px,calc(100vw - 20px));z-index:4;display:flex;flex-direction:column;border-radius:8px;overflow:hidden}
#chat-log{height:150px;overflow:hidden auto;padding:6px 8px;background:rgba(0,0,0,.45);font-size:15px;scrollbar-width:thin;-webkit-user-select:text;user-select:text}
#chat.focus #chat-log{background:rgba(0,0,0,.6)}
.cl{overflow-wrap:anywhere;text-shadow:0 1px 2px #000;padding:1px 0}
.cl.system{color:#ddd}
.cl .who{font-weight:700}
#chat-form{display:flex;background:rgba(25,27,29,.7);border-top:1px solid var(--line)}
#chat-input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:inherit;padding:9px 10px}
#chat-input::placeholder{color:#aaa}
#chat-input:disabled{cursor:not-allowed}
#chat.hidden{display:none}

/* player list */
#plist{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));width:min(260px,calc(100vw - 20px));max-height:60vh;overflow:auto;background:rgba(0,0,0,.45);border-radius:8px;z-index:4;-webkit-user-select:text;user-select:text}
#plist header{padding:8px 10px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.pr{display:flex;gap:8px;align-items:center;padding:6px 10px}
.pr.you{background:rgba(255,255,255,.12)}
.pr img,.pr .ph{width:28px;height:28px;border-radius:50%;background:#333;flex:none;object-fit:cover}
.pr span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* escape menu */
#esc{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:12px}
#esc .sheet{width:min(720px,100%);height:min(460px,100%);background:var(--ui-solid);border-radius:12px;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,.6)}
#esc nav{display:flex;border-bottom:1px solid var(--line)}
#esc nav button{flex:1;padding:14px 8px;background:transparent;color:var(--dim);font-weight:700;border-bottom:3px solid transparent}
#esc nav button[aria-selected=true]{color:#fff;border-bottom-color:#fff}
#esc .body{padding:16px;overflow:auto;-webkit-user-select:text;user-select:text}
#esc .foot{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.btn{flex:1;padding:12px 8px;border-radius:8px;background:#393b3d;font-weight:700}
.btn:hover{background:#4b4e50}
.btn.primary{background:#fff;color:#000}
.btn.danger{background:#fff;color:#000}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--dim)}.kv dd{margin:0;overflow-wrap:anywhere}

/* modal + loading */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(0,0,0,.65)}
.card{width:min(420px,100%);background:var(--ui-solid);border-radius:12px;padding:20px;display:grid;gap:12px}
.card h1{font-size:20px;margin:0}
.card p{margin:0;color:var(--dim)}
.card label{display:grid;gap:4px;color:var(--dim);font-size:13px}
.card input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:#191b1d;color:#fff;width:100%;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:8px}
#loading{background:#000}
#loading .status{color:var(--dim);min-height:1.4em}
.spin{width:28px;height:28px;border:3px solid #444;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite;justify-self:center}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style></head><body>
<canvas id="game" aria-label="Game view (renderer not connected)"></canvas>

<div id="topbar" hidden>
<button class="tb" id="b-menu" aria-label="Roblox menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.6 2.4 2.4 18.4l16 3.2 3.2-16-16-3.2Zm7.3 7.1 3.4.7-.7 3.4-3.4-.7.7-3.4Z"/></svg></button>
<button class="tb" id="b-chat" aria-label="Chat" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h16a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/></svg></button>
<span id="spacer"></span>
<button class="tb" id="b-plist" aria-label="Player list" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M1 21c0-4 3.6-7 8-7s8 3 8 7H1Zm16-9a3.5 3.5 0 1 0-1.5-6.7A6 6 0 0 1 16 11a6 6 0 0 1-.4 2.2c.5.3 1 .5 1.4.5ZM18 14c3 .5 5 2.700 5 5.500V21h-4c0-2.500-.8-4.600-2.200-6.200.4-.4.8-.6 1.200-.8Z"/></svg></button>
</div>

<section id="chat" hidden aria-label="Chat">
<div id="chat-log" role="log" aria-live="polite"></div>
<form id="chat-form" autocomplete="off"><input id="chat-input" type="text" maxlength="200" aria-label="Chat message" placeholder="To chat click here or press / key" disabled></form>
</section>

<aside id="plist" hidden aria-label="Players"><header><span>Players</span><span id="pcount"></span></header><div id="prows"></div></aside>

<div id="esc" hidden role="dialog" aria-modal="true" aria-label="Menu">
<div class="sheet">
<nav role="tablist" id="tabs"></nav>
<div class="body" id="tabbody"></div>
<div class="foot"><button class="btn danger" id="m-leave">Leave</button><button class="btn" id="m-reset" disabled title="Needs the game connection">Reset Character</button><button class="btn primary" id="m-resume">Resume</button></div>
</div></div>

<div id="confirm" class="overlay" hidden role="alertdialog" aria-modal="true" aria-label="Leave game">
<div class="card"><h1>Leave game?</h1><p>You will be disconnected from this server.</p>
<div class="row"><button class="btn danger" id="c-leave">Leave</button><button class="btn" id="c-cancel">Cancel</button></div></div></div>

<div id="loading" class="overlay">
<div class="card">
<h1>WebBlox</h1>
<p id="l-note">Join a place. The 3D view stays black for now; the interface is live.</p>
<form id="l-form" class="card" style="padding:0;background:none" autocomplete="off">
<label>Place id<input id="l-place" inputmode="numeric" placeholder="e.g. 10879318443"></label>
<label>Server id (optional)<input id="l-job" placeholder="Job id"></label>
<label id="l-cookie-field">.ROBLOSECURITY<input id="l-cookie" type="password" placeholder="Saved on this device only"></label>
<button class="btn primary" id="l-go" type="submit">Play</button>
</form>
<div id="l-busy" hidden class="card" style="padding:0;background:none"><div class="spin"></div><div class="status" id="l-status" role="status" aria-live="polite"></div><button class="btn" id="l-cancel" type="button">Cancel</button></div>
</div></div>

<script type="module">
const HEX = /^[0-9a-f]{40}$/i, TTL = 60000;
const read = (r) => { try { const o = JSON.parse(localStorage.getItem("wb.sha." + r) || "null"); return o && HEX.test(o.sha) ? o : null; } catch { return null; } };
const write = (r, o) => { try { localStorage.setItem("wb.sha." + r, JSON.stringify(o)); } catch {} };
const latest = async (repo) => {
  const c = read(repo), now = Date.now();
  if (c && now - c.at < TTL) return c.sha;
  const ctrl = new AbortController(), k = setTimeout(() => ctrl.abort(), 4000);
  try {
    const r = await fetch("https://api.github.com/repos/" + repo + "/commits/main", { headers: { Accept: "application/vnd.github+json" }, signal: ctrl.signal, cache: "no-store" });
    if (r.ok) { const d = await r.json(); if (d && HEX.test(d.sha)) { write(repo, { sha: d.sha, at: Date.now() }); return d.sha; } }
  } catch {} finally { clearTimeout(k); }
  return c ? c.sha : "";
};
(async () => {
  const s = await latest("rtischeduler/WebBlox");
  const bases = [s && "https://cdn.jsdelivr.net/gh/rtischeduler/WebBlox@" + s + "/", ...["cdn", "fastly", "gcore"].map((h) => "https://" + h + ".jsdelivr.net/gh/rtischeduler/WebBlox@main/")].filter(Boolean);
  let mod = null, last = null;
  for (const b of bases) { try { mod = await import(b + "src/play/app.mjs"); break; } catch (e) { last = e; } }
  if (!mod) { try { mod = await import("./src/play/app.mjs"); } catch (e) { throw last || e; } }
  await mod.boot();
})().catch((e) => { const st = document.getElementById("l-note"); if (st) st.textContent = "Failed to load: " + (e && e.message || e); console.error(e); });
</script>
</body></html>
